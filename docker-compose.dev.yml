services:
  backend:
    image: golang:1.26-alpine
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8888"
      SWAGGER_ADDR: ":9090"
      POSTGRES_DSN: "postgresql://umbrella_user:umbrella_pass@postgres:5432/umbrella_db?sslmode=disable"
      CGO_ENABLED: "0"
    command: >
      sh -c "apk add --no-cache git && go install github.com/air-verse/air@latest && air -c .air.backend.toml"
    ports:
      - "8888:8888"
      - "9090:9090"
    volumes:
      - .:/workspace
      - go_pkg_mod:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

  daemon:
    image: golang:1.26-alpine
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAEMON_FOREGROUND: "1"
      UMBRELLA_CONFIG_PATH: "./configs/umbrella/mainnet.json"
      POSTGRES_DSN: "postgresql://umbrella_user:umbrella_pass@postgres:5432/umbrella_db?sslmode=disable"
      RPC_URL: "${RPC_URL:?set RPC_URL in .env or shell environment}"
      CGO_ENABLED: "0"
    command: >
      sh -c "apk add --no-cache git && go install github.com/air-verse/air@latest && air -c .air.daemon.toml"
    volumes:
      - .:/workspace
      - go_pkg_mod:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

volumes:
  go_pkg_mod:
  go_build_cache:
