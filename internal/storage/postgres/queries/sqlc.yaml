version: '2'
sql:
  - engine: 'postgresql'
    schema:
      - '../../../../migrations/*.up.sql'
    queries: '.'
    gen:
      go:
        package: 'queries'
        out: '.'
        sql_package: 'database/sql'
        emit_interface: false
        emit_json_tags: false
        emit_db_tags: false
        overrides:
          - db_type: 'pg_catalog.numeric'
            go_type: 'string'
