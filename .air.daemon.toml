root = "."
tmp_dir = "tmp/air-daemon"

[build]
cmd = "go build -o ./tmp/air-daemon/daemon ./apps/daemon"
bin = "./tmp/air-daemon/daemon"
full_bin = "./tmp/air-daemon/daemon"
include_ext = ["go", "json"]
exclude_dir = ["tmp", "vendor", "testdata"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true
