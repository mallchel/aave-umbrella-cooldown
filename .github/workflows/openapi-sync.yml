name: OpenAPI Sync Check

on:
  pull_request:
  push:

jobs:
  openapi-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify OpenAPI artifacts are in sync
        run: make openapi-check
