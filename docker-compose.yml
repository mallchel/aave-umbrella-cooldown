services:
  postgres:
    image: postgres:16-alpine
    container_name: umbrella-postgres
    environment:
      POSTGRES_USER: umbrella_user
      POSTGRES_PASSWORD: umbrella_pass
      POSTGRES_DB: umbrella_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbrella_user -d umbrella_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgresql://umbrella_user:umbrella_pass@postgres:5432/umbrella_db?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
      target: backend-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8888"
      SWAGGER_ADDR: ":9090"
      POSTGRES_DSN: "postgresql://umbrella_user:umbrella_pass@postgres:5432/umbrella_db?sslmode=disable"
    ports:
      - "8888:8888"
      - "9090:9090"

  daemon:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
      target: daemon-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DAEMON_FOREGROUND: "1"
      UMBRELLA_CONFIG_PATH: "/app/configs/umbrella/mainnet.json"
      POSTGRES_DSN: "postgresql://umbrella_user:umbrella_pass@postgres:5432/umbrella_db?sslmode=disable"
      RPC_URL: "https://ethereum-rpc.publicnode.com"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: umbrella-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3030:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:
